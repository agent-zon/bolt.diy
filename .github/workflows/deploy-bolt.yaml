name: Deploy Bolt to Kubernetes

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'helm/bolt/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-bolt.yaml'
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'devspace'
      environment:
        description: 'Deployment environment'
        required: false
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'production'

concurrency:
  group: deploy-bolt-${{ github.ref }}
  cancel-in-progress: false

env:
  HELM_VERSION: 'v3.13.0'
  KUBECTL_VERSION: 'v1.28.0'
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event.inputs.image_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: bolt-ai-production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    environment: ${{ github.event.inputs.environment || 'development' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Configure kubectl
        env:
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_USER: ${{ secrets.KUBE_USER }}
        run: |
          KUBE_USER="${KUBE_USER:-deployer}"
          KUBE_CLUSTER="kubernetes"
          KUBE_SERVER="${KUBE_SERVER:-https://kubernetes.default.svc}"
          
          kubectl config set-cluster "$KUBE_CLUSTER" --server="$KUBE_SERVER" --insecure-skip-tls-verify=true
          kubectl config set-credentials "$KUBE_USER" --token="$KUBE_TOKEN"
          kubectl config set-context "$KUBE_CLUSTER" --cluster="$KUBE_CLUSTER" --user="$KUBE_USER"
          kubectl config use-context "$KUBE_CLUSTER"

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl version --short || kubectl version

      - name: Set namespace
        id: namespace
        run: |
          NAMESPACE="${{ github.event.inputs.namespace }}"
          if [ -z "$NAMESPACE" ]; then
            NAMESPACE="devspace"
          fi
          echo "namespace=$NAMESPACE" >> $GITHUB_OUTPUT
          echo "Deploying to namespace: $NAMESPACE"

      - name: Create namespace
        run: |
          kubectl create namespace ${{ steps.namespace.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Lint Helm Chart
        run: |
          helm lint ./helm/bolt

      - name: Deploy with Helm
        run: |
          helm upgrade --install bolt ./helm/bolt \
            --namespace ${{ steps.namespace.outputs.namespace }} \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ steps.image.outputs.name }} \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --wait \
            --timeout 10m \
            --atomic

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/bolt \
            -n ${{ steps.namespace.outputs.namespace }} \
            --timeout=10m

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployment bolt -n ${{ steps.namespace.outputs.namespace }}
          
          echo ""
          echo "=== Service Status ==="
          kubectl get service bolt -n ${{ steps.namespace.outputs.namespace }}
          
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ steps.namespace.outputs.namespace }} -l app=bolt
          
          echo ""
          echo "=== Recent Events ==="
          kubectl get events -n ${{ steps.namespace.outputs.namespace }} --sort-by='.lastTimestamp' | tail -20

      - name: Get pod logs
        if: failure()
        run: |
          echo "=== Pod Logs ==="
          kubectl logs -n ${{ steps.namespace.outputs.namespace }} -l app=bolt --tail=100 || true

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Bolt deployment successful!"
          echo ""
          echo "Service URL: http://bolt.${{ steps.namespace.outputs.namespace }}.svc.cluster.local:5173"
          echo ""
          echo "To check logs:"
          echo "  kubectl logs -n ${{ steps.namespace.outputs.namespace }} -l app=bolt -f"
          echo ""
          echo "To port-forward:"
          echo "  kubectl port-forward -n ${{ steps.namespace.outputs.namespace }} svc/bolt 5173:5173"
          echo ""
          echo "Then open: http://localhost:5173"
