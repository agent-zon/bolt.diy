# values-combined.yaml
# Use this values file to deploy Bolt WITH AI Core proxy together
# This will be used in Phase 3 after we add the proxy to the Helm chart
#
# Deploy with:
#   helm install bolt ./helm/bolt -f helm/bolt/values-combined.yaml --namespace devspace

# Bolt configuration
replicaCount: 1

image:
  repository: bolt-ai
  pullPolicy: Always
  tag: "production"

namespace: devspace

# Enable AI Core proxy deployment
aiCoreProxy:
  enabled: true
  image:
    repository: scai-dev.common.repositories.cloud.sap/aap/sap-ai-proxy
    tag: latest
    pullPolicy: Always
  
  # Image pull secrets for private registry
  imagePullSecrets:
    - name: docker-registry-secret
  
  # AI Core proxy service configuration
  service:
    port: 3002
    targetPort: 3002
  
  # AI Core configuration
  config:
    appname: "99a49c91-c0af-477b-89ff-5d180b7f401d!b1328962|xsuaa_std!b318061"
    clientid: "sb-99a49c91-c0af-477b-89ff-5d180b7f401d!b1328962|xsuaa_std!b318061"
    clientsecret: "dbc41c0c-aaee-4051-a4b0-86a2ace27598$j4unLvUk4In12Bo26PNr5Apkz9z0MD2Wyh-OJSsqP3k="
    credential-type: "binding-secret"
    identityzone: "experiments-1234"
    identityzoneid: "95e48ebf-f5e5-4c04-a317-6f0a613054f6"
    serviceurls:
      AI_API_URL: "https://api.ai.intprod-eu12.eu-central-1.aws.ml.hana.ondemand.com"
    url: "https://experiments-1234.authentication.eu12.hana.ondemand.com"
  resourceGroup: "default"
  
  # Observability
  observability:
    otel:
      enabled: true
      endpoint: "http://aspire-dashboard:18889"
      serviceName: "ai-core-proxy"
  
  # Resources for AI Core proxy
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

# LLM Provider Configuration - use deployed AI Core proxy
llm:
  enabled: true
  provider: "ai-core-proxy"

# Point Bolt to the AI Core proxy service
llmBaseUrls:
  openaiLikeApiBaseUrl: "http://ai-core-proxy.devspace.svc.cluster.local:3002"

# Secrets
secrets:
  openaiApiKey: "dummy-api-key"

# Bolt environment configuration
env:
  nodeEnv: "production"
  port: "5173"
  host: "0.0.0.0"
  viteLogLevel: "info"
  runningInDocker: "true"
  wranglerSendMetrics: "false"

# Bolt resources
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Service configuration
service:
  type: ClusterIP
  port: 5173
  targetPort: 5173

# Ingress (optional)
ingress:
  enabled: false
