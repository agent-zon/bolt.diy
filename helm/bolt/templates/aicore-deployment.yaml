{{- if .Values.aiCoreProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-core-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: ai-core-proxy
    {{- include "bolt.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-core-proxy
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/aicore-configmap.yaml") . | sha256sum }}
      labels:
        app: ai-core-proxy
    spec:
      {{- if .Values.aiCoreProxy.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.aiCoreProxy.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ai-core-proxy
        image: "{{ .Values.aiCoreProxy.image.repository }}:{{ .Values.aiCoreProxy.image.tag }}"
        imagePullPolicy: {{ .Values.aiCoreProxy.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.aiCoreProxy.service.targetPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ai-core-proxy
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.aiCoreProxy.resources | nindent 12 }}
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
{{- end }}
