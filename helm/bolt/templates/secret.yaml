apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bolt.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bolt.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LLM Provider API Keys
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.googleGenerativeAiApiKey }}
  GOOGLE_GENERATIVE_AI_API_KEY: {{ .Values.secrets.googleGenerativeAiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.groqApiKey }}
  GROQ_API_KEY: {{ .Values.secrets.groqApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.huggingfaceApiKey }}
  HuggingFace_API_KEY: {{ .Values.secrets.huggingfaceApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.openRouterApiKey }}
  OPEN_ROUTER_API_KEY: {{ .Values.secrets.openRouterApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.deepseekApiKey }}
  DEEPSEEK_API_KEY: {{ .Values.secrets.deepseekApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.mistralApiKey }}
  MISTRAL_API_KEY: {{ .Values.secrets.mistralApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.cohereApiKey }}
  COHERE_API_KEY: {{ .Values.secrets.cohereApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.togetherApiKey }}
  TOGETHER_API_KEY: {{ .Values.secrets.togetherApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.hyperbolicApiKey }}
  HYPERBOLIC_API_KEY: {{ .Values.secrets.hyperbolicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.xaiApiKey }}
  XAI_API_KEY: {{ .Values.secrets.xaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.perplexityApiKey }}
  PERPLEXITY_API_KEY: {{ .Values.secrets.perplexityApiKey | quote }}
  {{- end }}
  
  # GitHub integration
  {{- if .Values.secrets.githubAccessToken }}
  VITE_GITHUB_ACCESS_TOKEN: {{ .Values.secrets.githubAccessToken | quote }}
  {{- end }}
  {{- if .Values.secrets.githubTokenType }}
  VITE_GITHUB_TOKEN_TYPE: {{ .Values.secrets.githubTokenType | quote }}
  {{- end }}
  
  # GitLab integration
  {{- if .Values.secrets.gitlabAccessToken }}
  VITE_GITLAB_ACCESS_TOKEN: {{ .Values.secrets.gitlabAccessToken | quote }}
  {{- end }}
  
  # Deployment integrations
  {{- if .Values.secrets.vercelAccessToken }}
  VITE_VERCEL_ACCESS_TOKEN: {{ .Values.secrets.vercelAccessToken | quote }}
  {{- end }}
  {{- if .Values.secrets.netlifyAccessToken }}
  VITE_NETLIFY_ACCESS_TOKEN: {{ .Values.secrets.netlifyAccessToken | quote }}
  {{- end }}
  
  # Supabase
  {{- if .Values.secrets.supabaseUrl }}
  VITE_SUPABASE_URL: {{ .Values.secrets.supabaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseAnonKey }}
  VITE_SUPABASE_ANON_KEY: {{ .Values.secrets.supabaseAnonKey | quote }}
  {{- end }}
  {{- if .Values.secrets.supabaseAccessToken }}
  VITE_SUPABASE_ACCESS_TOKEN: {{ .Values.secrets.supabaseAccessToken | quote }}
  {{- end }}
