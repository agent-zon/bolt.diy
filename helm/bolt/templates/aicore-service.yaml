{{- if .Values.aiCoreProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ai-core-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: ai-core-proxy
    {{- include "bolt.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.aiCoreProxy.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: ai-core-proxy
{{- end }}
