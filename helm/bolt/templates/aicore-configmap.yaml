{{- if .Values.aiCoreProxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-core-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: ai-core-proxy
    {{- include "bolt.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.aiCoreProxy.service.targetPort | quote }}
  AICORE_CONFIG: {{ toJson .Values.aiCoreProxy.config | quote }}
  AICORE_RESOURCE_GROUP: {{ .Values.aiCoreProxy.resourceGroup | quote }}
  {{- if .Values.aiCoreProxy.observability.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.aiCoreProxy.observability.otel.endpoint | quote }}
  OTEL_SERVICE_NAME: {{ .Values.aiCoreProxy.observability.otel.serviceName | quote }}
  {{- end }}
{{- end }}
