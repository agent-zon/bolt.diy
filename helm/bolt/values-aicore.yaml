# values-aicore.yaml
# Use this values file to deploy Bolt with AI Core proxy integration
# Assumes AI Core proxy is already deployed at: ai-core-proxy.devspace.svc.cluster.local:3002
#
# Deploy with:
#   helm upgrade bolt ./helm/bolt -f helm/bolt/values-aicore.yaml --namespace devspace

# Use the same base configuration
replicaCount: 1

image:
  repository: bolt-ai
  pullPolicy: Always
  tag: "production"

namespace: devspace

# LLM Provider Configuration - AI Core Proxy
llm:
  enabled: true
  provider: "ai-core-proxy"
  
# Configure OpenAI-like base URL to point to AI Core proxy
llmBaseUrls:
  # Point to AI Core proxy in devspace namespace
  openaiLikeApiBaseUrl: "http://ai-core-proxy.devspace.svc.cluster.local:3002"

# Secrets for AI Core proxy
secrets:
  # AI Core proxy uses dummy API key for OpenAI compatibility
  openaiApiKey: "dummy-api-key"
  
  # Optional: Add other API keys if needed for fallback providers
  # anthropicApiKey: ""
  # googleGenerativeAiApiKey: ""

# Environment configuration
env:
  nodeEnv: "production"
  port: "5173"
  host: "0.0.0.0"
  viteLogLevel: "debug"  # Set to debug for troubleshooting
  runningInDocker: "true"
  wranglerSendMetrics: "false"

# Resource limits - AI workloads can be resource-intensive
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# Service configuration
service:
  type: ClusterIP
  port: 5173
  targetPort: 5173

# Optional: Enable ingress for external access
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: bolt.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
